name: Godot tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Import, validate scripts and run tests
        run: scripts/test.sh
      - name: Smoke test menu, game and sandbox
        run: |
          set -o pipefail
          for scene in menu game sandbox; do
            godot --headless --path . --quit-after 5 -- --scene="$scene" --lang=th --save-path=user://ci-smoke.json 2>&1 | tee smoke.log
            ! grep -Eq 'SCRIPT ERROR:|^ERROR:' smoke.log
          done
      - name: Smoke test complete game policies
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/bot_sim.gd -- --bot=all --runs=1 --candidates=4 2>&1 | tee bots.log
          ! grep -Eq 'SCRIPT ERROR:|^ERROR:' bots.log
