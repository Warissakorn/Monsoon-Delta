name: Godot tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Import, validate scripts and run tests
        run: scripts/test.sh
      - name: Smoke test menu, game and sandbox
        run: |
          set -o pipefail
          for scene in menu game sandbox; do
            godot --headless --path . --quit-after 5 -- --scene="$scene" --lang=th --save-path=user://ci-smoke.json 2>&1 | tee smoke.log
            ! grep -Eq 'SCRIPT ERROR:|^ERROR:' smoke.log
          done
          godot --headless --path . --quit-after 5 -- --scene=game --run-mode=long --goal=forest --lang=en --save-path=user://ci-long-smoke.json 2>&1 | tee smoke.log
          ! grep -Eq 'SCRIPT ERROR:|^ERROR:' smoke.log
      - name: Smoke test complete game policies
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/bot_sim.gd -- --bot=all --runs=1 --candidates=4 2>&1 | tee bots.log
          ! grep -Eq 'SCRIPT ERROR:|^ERROR:' bots.log

      - name: Verify balance experiment CLI and reports
        run: python3 scripts/test_balance_cli.py
      - name: Verify TS-06 balance report checker
        run: python3 scripts/test_check_balance.py
      - name: Smoke test balance scenarios
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/bot_sim.gd -- --scenarios=res://tools/scenarios/m3_screen.json --bot=all --runs=2 --candidates=4 2>&1 | tee scenarios.log
          ! grep -Eq 'SCRIPT ERROR:|^ERROR:' scenarios.log
      - name: Upload bot experiment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-experiment-reports
          path: bot_reports/
          if-no-files-found: ignore
