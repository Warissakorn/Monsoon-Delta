# .github/workflows/tests.yml
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
      - name: Import project
        run: '"$RUNNER_TEMP/godot" --headless --path . --import'
      - name: Unit tests
        run: GODOT="$RUNNER_TEMP/godot" bash tools/test.sh
      - name: UI smoke test
        run: |
          "$RUNNER_TEMP/godot" --headless --path . -- --scene=game --seed=7 --autoplay=12 --fast 2>&1 | tee smoke.log
          ! grep -q "SCRIPT ERROR" smoke.log